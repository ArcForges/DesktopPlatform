# SPDX-License-Identifier: AGPL-3.0-only
# The OS secret-store integration tier (ArcForges-Design docs/architecture/16-testing-strategy.md section 1; AD-0016 amendment of
# 2026-10-17): the Windows Credential Manager tests of tests/OsSecretStoreTests on a disposable GitHub-hosted runner, alone and
# sequential, with strict operation limits, unique names and verified cleanup. It is its own workflow, so a manual dispatch runs only
# it. It runs for external pull requests, merge_group, manual dispatch and a weekly schedule; it is skipped for the owner's pull
# requests and never runs on a push. The opt-in ARCFORGES_OS_SECRET_STORE_TESTS is set only on the tier's test step.
name: OS secret-store tier
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 3'
permissions:
  contents: read
concurrency:
  group: os-secret-store-tier-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
jobs:
  credential-manager:
    name: OS secret-store tier (Windows Credential Manager)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'deku2026') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/OsSecretStoreTests/ArcForges.Tests.OsSecretStoreTests.csproj --locked-mode
      - run: dotnet build tests/OsSecretStoreTests/ArcForges.Tests.OsSecretStoreTests.csproj -c Release --no-restore
      - name: Run the OS secret-store tier (the only step with the opt-in)
        timeout-minutes: 6
        env:
          ARCFORGES_OS_SECRET_STORE_TESTS: '1'
        run: dotnet test --project tests/OsSecretStoreTests/ArcForges.Tests.OsSecretStoreTests.csproj -c Release --no-build --results-directory artifacts/evidence/os-secret-store-tier --report-xunit-trx --report-xunit-trx-filename os-secret-store-tier.trx
      - name: Keep the run's name list and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: os-secret-store-tier-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/os-secret-store-tier/
          if-no-files-found: warn
          retention-days: 30
