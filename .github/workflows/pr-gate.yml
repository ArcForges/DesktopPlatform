# SPDX-License-Identifier: AGPL-3.0-only
name: PR gate
on:
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.managed-packages.outputs.version }}
      artifact_name:
        value: ${{ jobs.managed-packages.outputs.artifact_name }}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  allocate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) { $version = "1.0.0-ci.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT" }
          python eng/packaging/packages.py version --version $version
          if ($LASTEXITCODE) { throw 'Invalid package version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
  managed-packages:
    needs: [allocate-version, native, secret-scan, repository-hooks, design-policy, licence-policy, provenance-policy, reference-policy, runtime-policy, reconciliation-policy]
    uses: ./.github/workflows/package-validation.yml
    with:
      version: ${{ needs.allocate-version.outputs.version }}
      native_artifact_name: ${{ needs.native.outputs.artifact_name }}
  native:
    uses: ./.github/workflows/native-abi.yml
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          show-openssf-scorecard: true
      - name: Scan the repository for secrets
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f" \
            detect --source=/repo --no-banner --redact --config=/repo/.gitleaks.toml

  repository-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --require-hashes -r eng/requirements-ci.txt
      - name: Run repository hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  design-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Reject source, export, citation and dependency drift
        run: python -m unittest discover -s eng -p test_design_policy.py -v
      - name: Reject aliased version axes and invalid build identities
        run: python -m unittest discover -s eng -p test_build_identity.py -v
      - name: Verify exports against an isolated immutable Design checkout
        run: python eng/design_policy.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: design-policy-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/design-policy.json
          if-no-files-found: error
          retention-days: 30

  licence-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - name: Verify reviewed dependency closure and publication refusal fixtures
        run: |
          python eng/dependency_policy.py
          python -m unittest discover -s eng -p test_dependency_policy.py -v
      - name: Reject incomplete declarations and invalid reference graphs
        run: python -m unittest discover -s eng -p test_licence_boundary.py -v
      - name: Verify actual managed build declarations
        run: python eng/licence_boundary.py --evaluate-managed --report artifacts/evidence/licence-managed.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: licence-policy-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/licence-*.json
          if-no-files-found: error
          retention-days: 30

  reference-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Reject invalid registrations and exercise real Git drift
        run: python -m unittest discover -s eng -p test_reference_baselines.py -v
      - name: Resolve all immutable Design and reference commits
        run: python eng/reference_baselines.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reference-policy-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/reference-baselines.json
          if-no-files-found: error
          retention-days: 30

  runtime-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Reject runtime, assignment and retired-scaffold drift
        run: python -m unittest discover -s eng -p test_runtime_ownership.py -v
      - name: Verify current owner and immutable family snapshots
        run: python eng/runtime_ownership.py --evaluate-managed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: runtime-policy-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/runtime-ownership.json
          if-no-files-found: error
          retention-days: 30

  reconciliation-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Reject incomplete inventory and linked source
        run: python -m unittest discover -s eng -p test_reconciliation.py -v
      - name: Verify historical and current immutable project trees
        run: python eng/reconciliation.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: reconciliation-policy-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/reconciliation.json
          if-no-files-found: error
          retention-days: 30

  provenance-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Reject incomplete records, history mutation and altered native closure
        run: python -m unittest discover -s tests/tooling -p 'test_*.py' -v
      - name: Verify actual source inventory and active native registrations
        shell: pwsh
        run: |
          python eng/check_provenance.py --owner DesktopPlatform --base "${{ startsWith(github.ref, 'refs/tags/') && github.sha || '' }}"
          if ($LASTEXITCODE) { throw 'Source provenance check failed.' }
          python eng/native_provenance.py
          if ($LASTEXITCODE) { throw 'Native provenance registration failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: provenance-policy-ubuntu-latest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/provenance.json
          if-no-files-found: error
          retention-days: 30

  ci:
    if: always()
    needs: [allocate-version, managed-packages, native, secret-scan, repository-hooks, design-policy, licence-policy, provenance-policy, reference-policy, runtime-policy, reconciliation-policy]
    runs-on: ubuntu-latest
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every platform gate
        shell: pwsh
        run: |
          $jobs = $env:CI_NEEDS | ConvertFrom-Json
          $failed = @($jobs.PSObject.Properties | Where-Object { $_.Value.result -ne 'success' })
          if ($failed.Count) { throw 'One or more platform gates did not succeed.' }
