# SPDX-License-Identifier: AGPL-3.0-only
name: PR gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  managed-packages:
    uses: ./.github/workflows/package-validation.yml
  native:
    uses: ./.github/workflows/native-abi.yml
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          show-openssf-scorecard: true
      - name: Scan the repository for secrets
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f" \
            detect --source=/repo --no-banner --redact --config=/repo/.gitleaks.toml

  repository-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pre-commit
        run: python3 -m pip install --disable-pip-version-check pre-commit
      - name: Run repository hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  ci:
    if: always()
    needs: [managed-packages, native, secret-scan, repository-hooks]
    runs-on: ubuntu-latest
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every platform gate
        shell: pwsh
        run: |
          $jobs = $env:CI_NEEDS | ConvertFrom-Json
          $failed = @($jobs.PSObject.Properties | Where-Object { $_.Value.result -ne 'success' })
          if ($failed.Count) { throw 'One or more platform gates did not succeed.' }
