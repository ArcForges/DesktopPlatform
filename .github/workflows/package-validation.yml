# SPDX-License-Identifier: AGPL-3.0-only
name: Package validation
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      native_artifact_name:
        type: string
        required: true
      naming_evidence_artifact:
        type: string
        required: true
      secret_evidence_artifact:
        type: string
        required: true
    outputs:
      version:
        value: ${{ jobs.pack.outputs.version }}
      artifact_name:
        value: ${{ jobs.pack.outputs.artifact_name }}
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
jobs:
  local-rpc-aot:
    name: Local RPC AOT compile (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/LocalRpcAotTests/LocalRpcAotTests.csproj --locked-mode
      - name: Publish the process probe with Native AOT (compile only)
        run: dotnet publish tests/LocalRpcAotTests/LocalRpcAotTests.csproj -c Release -r ${{ matrix.rid }} --no-restore
  local-rpc-service-aot:
    name: Local RPC service-mode AOT compile (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/LocalRpcServiceAotTests/LocalRpcServiceAotTests.csproj --locked-mode
      - name: Publish the service-mode probe with Native AOT (compile only; never executed)
        run: dotnet publish tests/LocalRpcServiceAotTests/LocalRpcServiceAotTests.csproj -c Release -r ${{ matrix.rid }} --no-restore
  secrets-aot:
    name: Secrets platform selection AOT compile (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/SecretStoreSelectionAotTests/SecretStoreSelectionAotTests.csproj --locked-mode
      - name: Publish the secrets selection probe with Native AOT (compile only; never executed)
        run: dotnet publish tests/SecretStoreSelectionAotTests/SecretStoreSelectionAotTests.csproj -c Release -r ${{ matrix.rid }} --no-restore
  content-sandbox-aot:
    name: Content helper AOT compile (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore src/DesktopHelpers/ArcForges.ContentSandbox/ArcForges.ContentSandbox.csproj --locked-mode
      - name: Publish the content helper with Native AOT (compile only; never executed)
        run: dotnet publish src/DesktopHelpers/ArcForges.ContentSandbox/ArcForges.ContentSandbox.csproj -c Release -r ${{ matrix.rid }} --no-restore
  grpc-web-aot:
    name: Generated gRPC-Web AOT compile (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/ReleaseArtifactTests/GrpcWeb/GrpcWebAotProbe.csproj --locked-mode
      - name: Publish the generated gRPC-Web probe with Native AOT (compile only; never executed, no endpoint contacted)
        run: dotnet publish tests/ReleaseArtifactTests/GrpcWeb/GrpcWebAotProbe.csproj -c Release -r ${{ matrix.rid }} --no-restore
  aot-probe:
    name: Avalonia TableView Native AOT probe (compile only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore the exact probe lock graph
        run: dotnet restore eng/verification/probe-evidence/Prf09.TableViewProbe.csproj --locked-mode
      - name: Publish the candidate control with Native AOT (compile only)
        run: dotnet publish eng/verification/probe-evidence/Prf09.TableViewProbe.csproj -c Release -r win-x64 --no-restore --verbosity minimal
  realtime-aot:
    name: Realtime Native AOT compile (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/ReleaseArtifactTests/Realtime/RealtimeAotProbe.csproj --locked-mode
      - name: Publish the realtime probe with Native AOT (compile only)
        run: dotnet publish tests/ReleaseArtifactTests/Realtime/RealtimeAotProbe.csproj -c Release -r ${{ matrix.rid }} --no-restore
  # The Linux build and tests: the same as the local Linux leg, which needs nothing from the Windows jobs.
  linux-platform:
    name: Linux build and platform tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore DesktopPlatform.slnx --locked-mode
      - run: dotnet format DesktopPlatform.slnx --verify-no-changes --no-restore
      - name: Test fail-closed invariant accounting
        run: python -m unittest discover -s eng/accounting -p 'test_*.py' -v
      - name: Test the OS secret-store guard of the test scripts
        run: python -m unittest discover -s eng -p 'test_os_secret_store_guard.py' -v
      - name: Build the platform on Linux
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: dotnet build DesktopPlatform.slnx -c Release --no-restore -p:EmitCompilerGeneratedFiles=true "-p:PackageVersion=$PACKAGE_VERSION" "-p:Version=$PACKAGE_VERSION"
      # Every suite of "Build and test platform ownership" below (read from that step) but the architecture gate, which
      # needs the Windows native evidence and runs in `pack`; the timing-sensitive LocalRpc suite runs alone.
      - name: Test platform ownership on Linux
        run: |
          python eng/verify_local.py managed-tests --jobs 4
          python eng/verify_local.py managed-tests --timing-sensitive
  # The native-dependent end of the gate, on Windows like the native stage it packs: the architecture gate (with the
  # native licence evidence), invariant accounting, the candidate and its packaging tests.
  pack:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Allocate version before compilation
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION
          python eng/packaging/packages.py version --version $version
          if ($LASTEXITCODE) { throw 'Invalid package version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=nuget-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.native_artifact_name }}
          path: artifacts/native-packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.naming_evidence_artifact }}
          path: artifacts/evidence/imported/naming
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.secret_evidence_artifact }}
          path: artifacts/evidence/imported/secret
      - name: Require successful external gates from this exact source and CI attempt
        run: python eng/architecture_evidence.py combine --naming artifacts/evidence/imported/naming/naming-architecture.json --secret artifacts/evidence/imported/secret/secret-architecture.json --output artifacts/evidence/architecture-gates.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/architecture-gates.json
          if-no-files-found: error
          retention-days: 30
      - run: dotnet restore DesktopPlatform.slnx --locked-mode
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-licence-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/native-architecture
      - name: Build and test platform ownership
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build DesktopPlatform.slnx -c Release --no-restore -p:EmitCompilerGeneratedFiles=true "-p:PackageVersion=$env:PACKAGE_VERSION" "-p:Version=$env:PACKAGE_VERSION"
          if ($LASTEXITCODE) { throw 'Platform build failed.' }
          $testResults = 'artifacts/evidence/test-results'
          New-Item -ItemType Directory -Force -Path $testResults | Out-Null
          Get-ChildItem -LiteralPath $testResults -Filter '*.trx' -File -ErrorAction SilentlyContinue | Remove-Item -Force
          $testFailures = [System.Collections.Generic.List[string]]::new()
          $accountingSuites = @(
            @{ Name = 'architecture-tests'; Project = 'tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj'; Label = 'Platform ownership tests' },
            @{ Name = 'foundation-tests'; Project = 'src/BuildingBlocks/ArcForges.Foundation/Tests/ArcForges.Foundation.Tests.csproj'; Label = 'Foundation primitive tests' },
            @{ Name = 'persistence-resources-tests'; Project = 'src/BuildingBlocks/ArcForges.Persistence.Resources/Tests/ArcForges.Persistence.Resources.Tests.csproj'; Label = 'Append store offline tests' },
            @{ Name = 'persistence-derived-tests'; Project = 'src/BuildingBlocks/ArcForges.Persistence.Derived/Tests/ArcForges.Persistence.Derived.Tests.csproj'; Label = 'Derived-store rebuild and eviction tests' },
            @{ Name = 'capabilities-tests'; Project = 'src/BuildingBlocks/ArcForges.Capabilities/Tests/ArcForges.Capabilities.Tests.csproj'; Label = 'Application composition tests' }
          )
          $lateAccountingSuites = @(
            @{ Name = 'security-tests'; Project = 'src/BuildingBlocks/ArcForges.Security/Tests/ArcForges.Security.Tests.csproj'; Label = 'Security actor chain tests' },
            @{ Name = 'persistence-tests'; Project = 'tests/PersistenceTests/ArcForges.Tests.PersistenceTests.csproj'; Label = 'Persistence transaction, journal and migration tests' }
          )
          foreach ($suite in $accountingSuites) {
            dotnet test --project $suite.Project -c Release --no-build --results-directory $testResults --report-xunit-trx --report-xunit-trx-filename "$($suite.Name).trx"
            if ($LASTEXITCODE) { $testFailures.Add($suite.Label) }
          }
          dotnet test --project tests/AssistantAbstractionsTests/AssistantAbstractionsTests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Assistant host isolation tests') }
          dotnet test --project src/DesignSystem/ArcForges.DesignSystem/Tests/ArcForges.DesignSystem.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Design system token and contrast tests') }
          dotnet test --project src/BuildingBlocks/ArcForges.Contributions/Tests/ArcForges.Contributions.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Contribution registration tests') }
          dotnet test --project src/BuildingBlocks/ArcForges.LocalRpc/Tests/ArcForges.LocalRpc.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Local RPC offline framing and authorization tests') }
          dotnet test --project src/BuildingBlocks/ArcForges.Observability/Tests/ArcForges.Observability.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Observability dimension and emission tests') }
          dotnet test --project src/BuildingBlocks/ArcForges.Observability.Desktop/Tests/ArcForges.Observability.Desktop.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Desktop diagnostics, consent and report approval tests') }
          dotnet test --project src/BuildingBlocks/ArcForges.Security.Secrets/Tests/ArcForges.Security.Secrets.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Per-application secrets broker and secure-store tests') }
          foreach ($suite in $lateAccountingSuites) {
            dotnet test --project $suite.Project -c Release --no-build --results-directory $testResults --report-xunit-trx --report-xunit-trx-filename "$($suite.Name).trx"
            if ($LASTEXITCODE) { $testFailures.Add($suite.Label) }
          }
          dotnet test --project src/DesignSystem/ArcForges.Desktop.Shell/Tests/ArcForges.Desktop.Shell.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Framework-neutral shell and layout restore tests') }
          dotnet test --project src/BuildingBlocks/ArcForges.Security.Audit/Tests/ArcForges.Security.Audit.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Append-only local audit tests') }
          dotnet test --project src/DesktopHelpers/ArcForges.ContentSandbox/Tests/ArcForges.ContentSandbox.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { $testFailures.Add('Content helper contract, broker and offline profile tests') }
          python eng/accounting/accounting.py report --source-commit "$env:GITHUB_SHA" --ci-run "$env:GITHUB_RUN_ID" --attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE) { $testFailures.Add('Invariant accounting report') }
          python src/BuildingBlocks/ArcForges.Foundation/Errors/generate_registry.py --check
          if ($LASTEXITCODE) { $testFailures.Add('Foundation reason registry') }
          if ($testFailures.Count -gt 0) { throw "Platform validation failed: $($testFailures -join ', ')" }
      - name: Retain generated invariant-accounting evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: invariant-accounting-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/invariant-accounting.json
            artifacts/evidence/test-results/desktopplatform-owner-results.json
            artifacts/evidence/test-results/*.trx
          if-no-files-found: warn
          retention-days: 30
      - name: Pack explicit release allowlist and verify immutable manifest
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: pwsh
        run: python eng/packaging/packages.py pack --version "$env:PACKAGE_VERSION"
      - name: Verify rejection of invalid versions and altered candidates
        run: python -m unittest discover -s eng/packaging -p 'test_*.py' -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 30
