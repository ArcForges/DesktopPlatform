# SPDX-License-Identifier: AGPL-3.0-only
name: Package validation
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      native_artifact_name:
        type: string
        required: true
    outputs:
      version:
        value: ${{ jobs.pack.outputs.version }}
      artifact_name:
        value: ${{ jobs.pack.outputs.artifact_name }}
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Allocate version before compilation
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION
          python eng/packaging/packages.py version --version $version
          if ($LASTEXITCODE) { throw 'Invalid package version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=nuget-candidate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.native_artifact_name }}
          path: artifacts/native-packages
      - run: dotnet restore DesktopPlatform.slnx --locked-mode
      - run: dotnet format DesktopPlatform.slnx --verify-no-changes --no-restore
      - name: Build and test platform ownership
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: pwsh
        run: |
          dotnet build DesktopPlatform.slnx -c Release --no-restore "-p:PackageVersion=$env:PACKAGE_VERSION" "-p:Version=$env:PACKAGE_VERSION"
          if ($LASTEXITCODE) { throw 'Platform build failed.' }
          dotnet test --project tests/ArchitectureTests/ArcForges.Tests.ArchitectureTests.csproj -c Release --no-build
          if ($LASTEXITCODE) { throw 'Platform ownership tests failed.' }
      - name: Pack explicit release allowlist and verify immutable manifest
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: python eng/packaging/packages.py pack --version "$PACKAGE_VERSION"
      - name: Verify rejection of invalid versions and altered candidates
        run: python -m unittest discover -s eng/packaging -p 'test_*.py' -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 30
