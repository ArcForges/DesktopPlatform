# SPDX-License-Identifier: AGPL-3.0-only
name: Deep check

on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: deep-check
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: codeql-csharp
    runs-on: windows-2025
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify effective managed toolchain
        run: python eng/check_toolchain.py --tools python dotnet
      - name: Build C#
        run: |
          dotnet restore DesktopPlatform.slnx --locked-mode
          dotnet build DesktopPlatform.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
