# SPDX-License-Identifier: AGPL-3.0-only
name: Deep check

on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: deep-check
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: codeql-csharp
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build C#
        run: |
          dotnet restore DesktopPlatform.slnx --locked-mode
          dotnet build DesktopPlatform.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
