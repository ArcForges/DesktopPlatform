name: Deep check

on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: deep-check
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VCPKG_COMMIT: 36677bbd0b3bf11da7376e62e14bffcc54d2eaeb
  SCCACHE_VERSION: 0.17.0
  SCCACHE_SHA256: 67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006
  VCPKG_LINUX_X64_GRAPH_REVISION: platform-no-mdf-v2

jobs:
  codeql:
    name: codeql-csharp
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\..\nuget-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build C#
        run: |
          dotnet restore DesktopPlatform.slnx --locked-mode
          dotnet build DesktopPlatform.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4

  native-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.3.3'
          ninjaVersion: '1.13.1'
      - run: sudo apt-get update && sudo apt-get install --yes autoconf autoconf-archive automake clang-tidy libtool libdrm-dev nasm yasm
      - name: Pin vcpkg checkout
        run: |
          root="${VCPKG_INSTALLATION_ROOT:?Runner vcpkg installation was not found.}"
          git -C "$root" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$root" checkout --detach --force "$VCPKG_COMMIT"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          test "$(git -C "$root" rev-parse HEAD)" = "$VCPKG_COMMIT"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - name: Resolve vcpkg toolchain fingerprint
        id: vcpkg-toolchain
        run: |
          set -euo pipefail
          identity="compiler=$(c++ --version | sed -n '1p');target=$(c++ -dumpmachine);compiler-version=$(c++ -dumpfullversion -dumpversion);linker=$(ld --version | sed -n '1p');libc=$(ldd --version | sed -n '1p');cmake=$(cmake --version | sed -n '1p');ninja=$(ninja --version)"
          fingerprint=$(printf '%s' "$identity" | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "vcpkg toolchain: $identity"
          echo "vcpkg toolchain fingerprint: $fingerprint"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_LINUX_X64_GRAPH_REVISION }}-${{ hashFiles('eng/native/vcpkg/ports/**') }}
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_LINUX_X64_GRAPH_REVISION }}-
            vcpkg-classic-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ env.VCPKG_COMMIT }}-runtime-gpu-and-static-shims-v1-
      - name: Install the pinned sccache
        run: |
          set -euo pipefail
          # Pinned by version and by digest: a compiler cache that silently changes version invalidates
          # every cached object, and an unverified download would be an unpinned build input.
          archive="$RUNNER_TEMP/sccache.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "$SCCACHE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -D -m 0755 "$RUNNER_TEMP/sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" \
            "$RUNNER_TEMP/bin/sccache"
          "$RUNNER_TEMP/bin/sccache" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Restore the sccache objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_VERSION }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-${{ hashFiles('native/**', 'CMakePresets.json') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_VERSION }}-${{ steps.vcpkg-toolchain.outputs.fingerprint }}-
      - name: Install Linux native dependencies
        run: |
          root="$VCPKG_ROOT"
          archives="$RUNNER_TEMP/vcpkg-archives"
          mkdir -p "$archives"
          export VCPKG_BINARY_SOURCES="clear;files,$archives,readwrite"
          "$root/vcpkg" install \
            'ffmpeg[core,avcodec,avfilter,avformat,swresample,swscale,vulkan,qsv,nvcodec,vaapi]:x64-linux-dynamic' \
            'libusb[core]:x64-linux-dynamic' \
            'miniaudio[core]:x64-linux-dynamic' \
            'opentimelineio[core]:x64-linux' \
            'opencolorio[core]:x64-linux' \
            'openimageio[core]:x64-linux' \
            'openexr[core]:x64-linux' \
            'imath[core]:x64-linux' \
            "--overlay-ports=$GITHUB_WORKSPACE/eng/native/vcpkg/ports"
      - name: Run clang-tidy, ASan, UBSan, tests, and fuzzers
        run: |
          set -euo pipefail
          sccache --start-server
          sccache --zero-stats
          cmake --preset linux-x64-runtime-shared-asan '-DCMAKE_CXX_CLANG_TIDY=clang-tidy'
          cmake --build --preset linux-x64-runtime-shared-asan
          ctest --preset linux-x64-runtime-shared-asan
          cmake --preset linux-x64-shim-static-asan '-DCMAKE_CXX_CLANG_TIDY=clang-tidy'
          cmake --build --preset linux-x64-shim-static-asan
          ctest --preset linux-x64-shim-static-asan
          artifacts/cmake/linux-x64/runtime-shared-asan/native/arcmedia-ffmpeg-abi/arcmedia_ffmpeg_abi_fuzzer -runs=2000
          for fuzzer in artifacts/cmake/linux-x64/shim-static-asan/native/*-abi/*_fuzzer; do
            "$fuzzer" -runs=2000
          done
          sccache --show-stats
      - name: Prove sccache actually cached
        run: |
          set -euo pipefail
          # A launcher that is configured but never consulted caches nothing while still looking green.
          stats=$(sccache --show-stats)
          printf '%s\n' "$stats"
          requests=$(printf '%s\n' "$stats" | sed -n 's/^Compile requests *\([0-9]\+\).*/\1/p' | head -1)
          test "${requests:-0}" -gt 0 || { echo 'sccache saw no compile requests.'; exit 1; }
