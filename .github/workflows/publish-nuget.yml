# SPDX-License-Identifier: AGPL-3.0-only
name: Publish NuGet
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
# Serialize main and deliberate tags without cancelling queued publications.
concurrency:
  group: desktopplatform-nuget-publication
  queue: max
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify effective Python selection
        run: python eng/check_toolchain.py --tools python
      - name: Allocate release version and validate publisher setup
        id: release
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER) -or $env:NUGET_USER -eq 'YOUR_NUGET_USERNAME') {
            throw 'Set repository variable NUGET_USER and the documented nuget.org trusted publisher.'
          }
          python eng/packaging/release_channels.py
          if ($LASTEXITCODE) { throw 'Invalid publisher identity or dependency closure.' }
  candidate:
    needs: preflight
    uses: ./.github/workflows/pr-gate.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'ArcForges/DesktopPlatform'
    needs: candidate
    runs-on: ubuntu-26.04
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify effective Python selection
        run: python eng/check_toolchain.py --tools python
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify effective managed toolchain
        run: python eng/check_toolchain.py --tools python dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: artifacts/packages
      # The candidate was packed on Windows next to the native stage (package-validation.yml `pack`); its checks are
      # content-based, so this job re-verifies the same bytes on Linux before authenticating.
      - name: Recheck source identity, allowlist, contents and hashes before authentication
        env:
          PACKAGE_VERSION: ${{ needs.candidate.outputs.version }}
          ARTIFACT_NAME: ${{ needs.candidate.outputs.artifact_name }}
        run: |
          # Authorize the candidate allocated for this run (retained by a failed-jobs-only retry) and bind
          # the downloaded manifest and artifact name to it; never re-derive a version from this attempt.
          python eng/packaging/release_channels.py --expected-version "$PACKAGE_VERSION" \
            --manifest artifacts/packages/manifest.json --artifact-name "$ARTIFACT_NAME"
          python eng/packaging/packages.py verify --version "$PACKAGE_VERSION" --commit "$GITHUB_SHA"
      - name: Exchange GitHub OIDC identity for a short-lived NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the same verified bytes
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath artifacts/packages/manifest.json -Raw | ConvertFrom-Json
          foreach ($package in $manifest.packages) {
            $path = Join-Path artifacts/packages $package.file
            dotnet nuget push $path --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE) { throw "NuGet publication failed for $($package.id). Existing versions are never overwritten or silently skipped." }
          }
          "Published version $($manifest.version) from source $($manifest.sourceCommit)." >> $env:GITHUB_STEP_SUMMARY
