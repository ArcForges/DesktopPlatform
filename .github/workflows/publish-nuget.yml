# SPDX-License-Identifier: AGPL-3.0-only
name: Publish NuGet
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
# Serialize main and deliberate tags without cancelling queued publications.
concurrency:
  group: desktopplatform-nuget-publication
  queue: max
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Allocate release version and validate publisher setup
        id: release
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER) -or $env:NUGET_USER -eq 'YOUR_NUGET_USERNAME') {
            throw 'Set repository variable NUGET_USER and the documented nuget.org trusted publisher.'
          }
          python eng/packaging/release_channels.py
          if ($LASTEXITCODE) { throw 'Invalid publisher identity or dependency closure.' }
  candidate:
    needs: preflight
    uses: ./.github/workflows/pr-gate.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'ArcForges/DesktopPlatform'
    needs: candidate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: artifacts/packages
      - name: Recheck source identity, allowlist, contents and hashes before authentication
        env:
          PACKAGE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          python eng/packaging/release_channels.py --expected-version "$PACKAGE_VERSION"
          python eng/packaging/packages.py verify --version "$PACKAGE_VERSION" --commit "$GITHUB_SHA"
      - name: Exchange GitHub OIDC identity for a short-lived NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the same verified bytes
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath artifacts/packages/manifest.json -Raw | ConvertFrom-Json
          foreach ($package in $manifest.packages) {
            $path = Join-Path artifacts/packages $package.file
            dotnet nuget push $path --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE) { throw "NuGet publication failed for $($package.id). Existing versions are never overwritten or silently skipped." }
          }
          "Published version $($manifest.version) from source $($manifest.sourceCommit)." >> $env:GITHUB_STEP_SUMMARY
