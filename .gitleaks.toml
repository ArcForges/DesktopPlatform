title = "ArcForges gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated outputs and public test fixtures"
paths = [
  '''(^|/)artifacts/''',
  '''(^|/)(bin|obj)/''',
  '''(^|/)tests/.*/Fixtures/'''
]

[[allowlists]]
description = "Exact PLT.40 public dependency-policy input lines"
paths = ['''^eng/policy/dependency-policy[.]json$''']
regexTarget = "line"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = [
  '''^\n?    "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/ArcForges[.]Security[.]Secrets[.]csproj": "8ff03fdcaf23b09386fac47dd5e3e4f9689a665a569137f726456c9e59a9ecef",$''',
  '''^\n?    "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/Tests/ArcForges[.]Security[.]Secrets[.]Tests[.]csproj": "d6798bbbcf980fab4467c6d831871b075e55aeef6e09c7df67c4d72cd2334120",$''',
  '''^\n?      "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/ArcForges[.]Security[.]Secrets[.]csproj": "8ff03fdcaf23b09386fac47dd5e3e4f9689a665a569137f726456c9e59a9ecef",$''',
  '''^\n?      "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/Tests/ArcForges[.]Security[.]Secrets[.]Tests[.]csproj": "d6798bbbcf980fab4467c6d831871b075e55aeef6e09c7df67c4d72cd2334120",$'''
]

[[allowlists]]
description = "Exact PLT.40 mirrored dependency-review input lines"
paths = ['''^eng/policy/dependency-reviews/plt-40-r1[.]json$''']
regexTarget = "line"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = [
  '''^\n?      "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/ArcForges[.]Security[.]Secrets[.]csproj": "8ff03fdcaf23b09386fac47dd5e3e4f9689a665a569137f726456c9e59a9ecef",$''',
  '''^\n?      "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/Tests/ArcForges[.]Security[.]Secrets[.]Tests[.]csproj": "d6798bbbcf980fab4467c6d831871b075e55aeef6e09c7df67c4d72cd2334120",$'''
]

[[allowlists]]
description = "Exact mirrored Security.Secrets project lines in any dependency-review receipt"
paths = ['''^eng/policy/dependency-reviews/[A-Za-z0-9._-]+[.]json$''']
regexTarget = "line"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = [
  '''^\n?      "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/ArcForges[.]Security[.]Secrets[.]csproj": "8ff03fdcaf23b09386fac47dd5e3e4f9689a665a569137f726456c9e59a9ecef",$''',
  '''^\n?      "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/Tests/ArcForges[.]Security[.]Secrets[.]Tests[.]csproj": "d6798bbbcf980fab4467c6d831871b075e55aeef6e09c7df67c4d72cd2334120",$'''
]

[[allowlists]]
description = "Exact PLT.46 successor Security.Secrets project input lines"
paths = [
  '''^eng/policy/dependency-policy[.]json$''',
  '''^eng/policy/dependency-reviews/plt-46-r1[.]json$''',
  '''^eng/policy/dependency-reviews/af-dp-01-r1[.]json$'''
]
regexTarget = "line"
targetRules = ["generic-api-key"]
condition = "AND"
regexes = [
  '''^\n?    "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/ArcForges[.]Security[.]Secrets[.]csproj": "7282dd206f5ca9cb59fe8d02e9423ac7080857fba03bd0ccff54410b4e2b6bff",$''',
  '''^\n?      "src/BuildingBlocks/ArcForges[.]Security[.]Secrets/ArcForges[.]Security[.]Secrets[.]csproj": "7282dd206f5ca9cb59fe8d02e9423ac7080857fba03bd0ccff54410b4e2b6bff",$'''
]
